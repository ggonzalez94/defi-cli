name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - uses: mlugg/setup-zig@v2

      - run: cargo install --locked cargo-zigbuild
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --workspace
      - run: cargo test --workspace --release

      - name: install GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          install-only: true
          workdir: .

      - name: release
        run: |
          ulimit -n 8192
          goreleaser release --clean --parallelism 1
        working-directory: .
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: sync docs-live branch to release tag
        if: ${{ !contains(github.ref_name, '-') }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git push origin "${GITHUB_SHA}:refs/heads/docs-live" --force

      - name: upload install marker
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > install-marker.txt <<EOF
          install event marker for defi-cli installer analytics
          repository=${GITHUB_REPOSITORY}
          tag=${GITHUB_REF_NAME}
          generated_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF
          gh release upload "${GITHUB_REF_NAME}" install-marker.txt --clobber
